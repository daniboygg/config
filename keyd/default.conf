[ids]

*

[main]

# Caps Lock: tap = Escape, hold = Hyper (Ctrl+Alt+Shift)
# Mirrors the macOS Karabiner rule "Change caps_lock to right shift+ctrl+option"
# (dotfiles/.config/karabiner/karabiner.json), used by the Hammerspoon hyper
# bindings in dotfiles/.hammerspoon/init.lua.
capslock = overload(hyper, esc)

# Escape takes over the Caps Lock toggle, completing the swap.
esc = capslock

[hyper:C-A-S]

# Hyper+Space opens launcher
space = M-slash

# Change [i]nput layout keyboard
i = M-space

# Hyper+P: window [p]osition prefix. Tap, release, then the second key.
p = oneshot(window)

[window]

# [m]aximize
m = M-m

# move to previous/next display
h = M-S-left
l = M-S-right

# composite layer, must come after [window]
[window+shift]

# tile to left/right half
h = C-M-left
l = C-M-right
